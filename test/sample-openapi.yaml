openapi: 3.0.3
info:
  title: Sample Test API
  version: 1.0.0
  description: Sample API specification for unit testing parser
security:
  - bearerAuth: []
paths:
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          example: 42
    get:
      summary: Get user by ID
      responses:
        '200':
          description: User found
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      summary: Update user
      responses:
        '200':
          description: Updated
        '401':
          description: Unauthorized

  /public/health:
    get:
      summary: Health check endpoint
      security: []
      responses:
        '200':
          description: OK

  /items:
    post:
      summary: Create item
      responses:
        '201':
          $ref: '#/components/responses/CreatedResponse'
        '401':
          description: Unauthorized
      parameters:
        - $ref: '#/components/parameters/FilterQuery'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    FilterQuery:
      name: filter
      in: query
      required: false
      schema:
        type: string
        default: active
  responses:
    CreatedResponse:
      description: Item successfully created
